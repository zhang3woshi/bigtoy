name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend static files
        working-directory: frontend
        run: |
          npm ci
          npm run build:backend

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare release artifacts directory
        run: mkdir -p release-artifacts

      - name: Package linux amd64
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=before,publish,announce,validate --config goreleaser-linux-amd64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect linux amd64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp dist/*.tar.gz release-artifacts/
          cp dist/SHA256SUMS-linux-amd64.txt release-artifacts/

      - name: Package linux arm64
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=before,publish,announce,validate --config goreleaser-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect linux arm64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp dist/*.tar.gz release-artifacts/
          cp dist/SHA256SUMS-linux-arm64.txt release-artifacts/

      - name: Package windows amd64
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=before,publish,announce,validate --config goreleaser-windows-amd64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect windows amd64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp dist/*.zip release-artifacts/
          cp dist/SHA256SUMS-windows-amd64.txt release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*
